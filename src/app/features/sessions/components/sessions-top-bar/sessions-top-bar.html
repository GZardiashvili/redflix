<div class="top-bar">
  <p class="top-bar__summary">{{ summary() }}</p>

  <label class="top-bar__sort">
    <span class="top-bar__sort-label">Sort:</span>
    <select
      class="top-bar__sort-select"
      name="sessions-sort"
      [value]="sort()"
      (change)="onSortChange($any($event.target).value)"
    >
      @for (option of sortOptions(); track option.id) {
        <option class="top-bar__sort-option" [value]="option.id">{{ option.label }}</option>
      }
    </select>
    <svg class="top-bar__sort-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M6 9.5 12 15.5 18 9.5" />
    </svg>
  </label>
</div>
