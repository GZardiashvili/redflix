@if (loading()) {
  <div class="movie-details__loading" role="status" aria-label="Loading movie details">
    <div class="movie-details__loading-hero">
      <span class="movie-details__loading-poster"><app-skeleton /></span>

      <span class="movie-details__loading-text">
        <app-skeleton variant="text" />
        <app-skeleton variant="text" />
      </span>
    </div>

    <div class="movie-details__loading-body">
      <app-skeleton variant="text" />
      <app-skeleton variant="text" />
    </div>
  </div>
} @else if (notFound()) {
  <app-empty-state
    title="Movie not found"
    message="We could not find that movie. It may have been removed from the schedule."
  >
    <a class="movie-details__action" routerLink="/">Back to home</a>
  </app-empty-state>
} @else if (error(); as message) {
  <app-error-state
    title="Movie unavailable"
    [message]="message"
    [canRetry]="true"
    (retry)="retry()"
  />
} @else if (movie(); as current) {
  <app-movie-hero [movie]="current" [statusLabel]="statusLabel()" />

  <div class="movie-details__body">
    <div class="movie-details__primary">
      @if (bookingBlockedByProfile()) {
        <p class="movie-details__profile-notice" role="status">
          Complete your profile before buying tickets. Your chosen screening is kept.
        </p>
      }

      <app-movie-showtimes
        [groups]="groups()"
        [selectedDate]="date()"
        [availableDates]="availableDates()"
        [loading]="sessionsAreLoading()"
        [error]="sessionsFailure()"
        [ageRestricted]="ageRestricted()"
        [restrictionMessage]="restrictionCopy()"
        (dateSelected)="onDateSelected($event)"
        (retry)="retrySessions()"
        (screeningSelected)="onScreeningSelected($event)"
      />
    </div>

    <app-movie-details-panel [movie]="current" [releaseDate]="releaseDate()" />
  </div>
}
