<a class="recently-viewed-card" [routerLink]="['/movies', movie().slug]" (click)="touch()">
  <img
    class="recently-viewed-card__poster"
    [src]="movie().posterUrl"
    [alt]="movie().title + ' poster'"
    loading="lazy"
  />

  <div class="recently-viewed-card__body">
    <h3 class="recently-viewed-card__title">{{ movie().title }}</h3>

    <p class="recently-viewed-card__meta">
      @if (genreLabel(); as genres) {
        <span>{{ genres }}</span>
        <span aria-hidden="true">•</span>
      }
      <span>{{ movie().runtimeMinutes }} min</span>
    </p>

    <app-rating-badge [code]="movie().rating" />
  </div>
</a>
