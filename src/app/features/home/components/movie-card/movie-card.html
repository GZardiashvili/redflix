<article class="movie-card">
  <img
    class="movie-card__poster"
    [src]="movie().posterUrl"
    [alt]="movie().title + ' poster'"
    loading="lazy"
  />

  <h3 class="movie-card__title">{{ movie().title }}</h3>

  <p class="movie-card__meta">
    @if (genreLabel(); as genres) {
      <span>{{ genres }}</span>
      <span aria-hidden="true">•</span>
    }
    <span>{{ movie().runtimeMinutes }} min</span>
  </p>

  <app-rating-badge [code]="movie().ageRating.code" />

  <div class="movie-card__footer">
    <p class="movie-card__price">From {{ movie().fromPrice }} ₾</p>

    <a class="movie-card__action" [routerLink]="['/movies', movie().slug]" (click)="recordView()">
      Buy ticket
    </a>
  </div>
</article>
