<article class="coming-soon-card">
  <img
    class="coming-soon-card__poster"
    [src]="movie().posterUrl"
    [alt]="movie().title + ' poster'"
    loading="lazy"
  />

  <div class="coming-soon-card__body">
    <h3 class="coming-soon-card__title">{{ movie().title }}</h3>

    <p class="coming-soon-card__meta">
      @if (genreLabel(); as genres) {
        <span>{{ genres }}</span>
        <span aria-hidden="true">•</span>
      }
      <span>{{ movie().runtimeMinutes }} min</span>
      <span aria-hidden="true">•</span>
      <span>Releases {{ movie().releaseDate }}</span>
    </p>

    <app-rating-badge [code]="movie().ageRating.code" />

    @if (notifyError(); as message) {
      <p class="coming-soon-card__error" role="alert">
        {{ message }}
        <button
          class="coming-soon-card__retry"
          type="button"
          (click)="notifyRequested.emit(movie())"
        >
          Try again
        </button>
      </p>
    }

    <button
      class="coming-soon-card__action"
      type="button"
      [disabled]="notifyPending() || notifySubscribed()"
      (click)="notifyRequested.emit(movie())"
    >
      @if (notifyPending()) {
        <app-loading-indicator size="sm" label="Subscribing to notifications" />
      } @else if (notifySubscribed()) {
        <span
          class="coming-soon-card__action-icon coming-soon-card__action-icon--done"
          aria-hidden="true"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="m3.5 8.5 3 3 6-6.5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        Notified
      } @else {
        <span class="coming-soon-card__action-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M5.99957 12.2505C5.99957 12.7809 6.21028 13.2896 6.58536 13.6647C6.96043 14.0398 7.46914 14.2505 7.99957 14.2505C8.53 14.2505 9.03871 14.0398 9.41378 13.6647C9.78886 13.2896 9.99957 12.7809 9.99957 12.2505M11.4996 1.75049C12.4651 2.36656 13.2482 3.22974 13.7677 4.25049M2.23145 4.25049C2.75093 3.22974 3.53404 2.36656 4.49957 1.75049M3.49957 7.25049C3.49957 6.05701 3.97368 4.91242 4.81759 4.06851C5.6615 3.22459 6.8061 2.75049 7.99957 2.75049C9.19304 2.75049 10.3376 3.22459 11.1816 4.06851C12.0255 4.91242 12.4996 6.05701 12.4996 7.25049C12.4996 9.48924 13.0183 10.788 13.4308 11.5005C13.4746 11.5764 13.4977 11.6624 13.4978 11.75C13.4979 11.8377 13.4749 11.9238 13.4313 11.9997C13.3876 12.0757 13.3247 12.1388 13.249 12.1828C13.1732 12.2269 13.0872 12.2502 12.9996 12.2505H2.99957C2.91206 12.25 2.82622 12.2265 2.75062 12.1824C2.67503 12.1383 2.61234 12.0751 2.56881 11.9992C2.52528 11.9233 2.50245 11.8373 2.50258 11.7497C2.50271 11.6622 2.52581 11.5763 2.56957 11.5005C2.98145 10.788 3.49957 9.48861 3.49957 7.25049Z"
              stroke="white"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        Notify Me
      }
    </button>
  </div>
</article>
