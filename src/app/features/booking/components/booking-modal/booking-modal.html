<app-modal
  variant="booking"
  [open]="open()"
  [title]="title()"
  closeLabel="Close booking"
  (closed)="close()"
>
  <app-hold-timer modalHeaderAside />

  @if (context(); as screening) {
    <app-booking-header [context]="screening" />

    <app-booking-step-indicator
      [active]="status()"
      (backToSeats)="showStep1()"
      (forwardToCheckout)="showStep2()"
    />

    @switch (status()) {
      @case ('step2') {
        <app-booking-step-checkout />
      }
      @default {
        <app-booking-step-seats />
      }
    }
  }
</app-modal>
