<!--
  Step 2 only makes sense with a hold behind it. The guard is not expected to be
  seen — an expiry takes the flow back to Step 1 by itself — but it keeps the
  layout from rendering an empty summary in the moment between the hold going and
  the step following it back.
-->
@if (hasHold()) {
  <section class="checkout" aria-labelledby="checkout-heading">
    <h3 class="checkout__heading" id="checkout-heading">Checkout</h3>

    <div class="checkout__layout">
      <form
        id="checkout-form"
        class="checkout__form"
        [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate
      >
        <!--
          The general sentence for a field-level 422. It sits above the form
          because it is about the submission as a whole; each field's own reason
          appears under that field instead, so this never repeats what a specific
          control already says.
        -->
        @if (fieldFailureMessage(); as message) {
          <p class="checkout__alert" role="alert">{{ message }}</p>
        }

        <div class="checkout__group">
          <app-form-field
            label="Full Name"
            controlId="checkout-full-name"
            [required]="true"
            [error]="errorFor('fullName')"
          >
            <input
              id="checkout-full-name"
              class="checkout__input"
              type="text"
              formControlName="fullName"
              placeholder="e.g. Jane Dolidze"
              autocomplete="name"
            />
          </app-form-field>

          <div class="checkout__row">
            <app-form-field
              label="Email"
              controlId="checkout-email"
              [required]="true"
              [error]="errorFor('email')"
            >
              <input
                id="checkout-email"
                class="checkout__input"
                type="email"
                formControlName="email"
                placeholder="e.g. user@example.com"
                autocomplete="email"
                inputmode="email"
              />
            </app-form-field>

            <app-form-field
              label="Mobile Number"
              controlId="checkout-mobile"
              [required]="true"
              [error]="errorFor('mobileNumber')"
            >
              <input
                id="checkout-mobile"
                class="checkout__input"
                type="tel"
                formControlName="mobileNumber"
                placeholder="e.g. 599 123 456"
                autocomplete="tel"
                inputmode="tel"
              />
            </app-form-field>
          </div>
        </div>

        <div class="checkout__group">
          <app-form-field
            label="Card Number"
            controlId="checkout-card-number"
            [required]="true"
            [error]="errorFor('cardNumber')"
          >
            <input
              id="checkout-card-number"
              class="checkout__input"
              type="text"
              formControlName="cardNumber"
              placeholder="e.g. 4242 4242 4242 4242"
              autocomplete="cc-number"
              inputmode="numeric"
              maxlength="23"
            />
          </app-form-field>

          <div class="checkout__row">
            <app-form-field
              label="Expiry"
              controlId="checkout-expiry"
              [required]="true"
              [error]="errorFor('expiry')"
            >
              <input
                id="checkout-expiry"
                class="checkout__input"
                type="text"
                formControlName="expiry"
                placeholder="MM/YY"
                autocomplete="cc-exp"
                inputmode="numeric"
                maxlength="5"
              />
            </app-form-field>

            <app-form-field
              label="CVV"
              controlId="checkout-cvv"
              [required]="true"
              [error]="errorFor('cvv')"
            >
              <!--
                A password field, not a number one: `type="number"` would discard
                the leading zeros a CVV may have, and offers no way to hide what
                was typed.
              -->
              <input
                id="checkout-cvv"
                class="checkout__input"
                type="password"
                formControlName="cvv"
                placeholder="123"
                autocomplete="cc-csc"
                inputmode="numeric"
                maxlength="3"
              />
            </app-form-field>
          </div>
        </div>

      </form>

      <div class="checkout__summary-column">
        <app-seat-selection-summary class="checkout__summary" [readOnly]="true" />

        <!--
          The commit action lives at the foot of the summary column, under the
          totals — that is where the design puts it. It submits the sibling
          form through `form="checkout-form"` rather than sitting inside it.
        -->
        <button
          class="checkout__pay"
          type="submit"
          form="checkout-form"
          [disabled]="!canSubmit() || form.invalid"
          [attr.aria-busy]="submitting()"
        >
          @if (submitting()) {
            <app-loading-indicator size="sm" label="Completing order" />
          } @else {
            Pay: Complete order
          }
        </button>
      </div>
    </div>
  </section>
}
