@if (loading()) {
  <div class="booking-step__status" role="status" aria-label="Loading seat map">
    <app-loading-indicator size="md" label="Loading seat map" />
  </div>
} @else if (error(); as message) {
  <div class="booking-step__status">
    <app-error-state
      title="Seat map unavailable"
      [message]="message"
      [canRetry]="true"
      (retry)="retry()"
    />
  </div>
} @else if (map(); as layout) {
  @if (isEmpty()) {
    <div class="booking-step__status">
      <app-empty-state
        title="No seat map"
        message="This hall has no seating information for this screening."
      />
    </div>
  } @else {
    <!--
        A `409` or an expired hold reports itself above the map rather than
        replacing it: the map is still the right thing to show, because the lost
        seats are about to be redrawn on it as taken. `role="alert"` so the loss
        is announced the moment it happens, rather than leaving the visitor to
        work out what changed.
      -->
    @if (failure(); as problem) {
      <p
        class="booking-step__banner"
        [class.booking-step__banner--conflict]="problem.kind === 'conflict'"
        role="alert"
      >
        {{ conflictMessage() ?? problem.message }}
      </p>
    }

    <div class="booking-step__layout">
      <!--
          The map column is two stacked boxes, not one scrolling box: only the
          canvas above scrolls. The key is a sibling of that scroll area, so it
          keeps its full height no matter how tall the hall is, and the canvas's
          horizontal scrollbar can never land on top of it. It is also the last
          thing the column gives up its space to — `flex-shrink: 0` — so a long
          hall shortens the map rather than squeezing the labels out of view.
        -->
      <div class="booking-step__map">
        <div class="booking-step__scroll">
          <app-seat-map [map]="layout" />
        </div>

        <app-seat-map-legend />
      </div>

      <app-seat-selection-summary />
    </div>
  }
}
