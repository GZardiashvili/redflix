@if (open()) {
  <div
    class="modal__overlay"
    [class.modal__overlay--booking]="variant() === 'booking'"
    (click)="onOverlayClick($event)"
  >
    <div
      #dialog
      class="modal__dialog"
      [class.modal__dialog--booking]="variant() === 'booking'"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      tabindex="-1"
    >
      <div class="modal__header">
        <h2 class="modal__title" [id]="titleId">{{ title() }}</h2>

        <!--
          Trailing group of the header: optional projected content — the booking
          dialog's hold timer — followed by the close control. Grouped so the title
          stays hard against the left edge and the rest sits together on the right,
          whichever optional pieces are projected in.
        -->
        <div class="modal__header-aside">
          <ng-content select="[modalHeaderAside]" />

          <button
            type="button"
            class="modal__close"
            [attr.aria-label]="closeLabel()"
            (click)="requestClose()"
          >
            &times;
          </button>
        </div>
      </div>

      <div class="modal__body">
        <ng-content />
      </div>
    </div>
  </div>
}
