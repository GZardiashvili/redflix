@if (open()) {
  <div class="modal__overlay" (click)="onOverlayClick($event)">
    <div
      #dialog
      class="modal__dialog"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      tabindex="-1"
    >
      <div class="modal__header">
        <h2 class="modal__title" [id]="titleId">{{ title() }}</h2>

        <button
          type="button"
          class="modal__close"
          [attr.aria-label]="closeLabel()"
          (click)="requestClose()"
        >
          &times;
        </button>
      </div>

      <div class="modal__body">
        <ng-content />
      </div>
    </div>
  </div>
}
