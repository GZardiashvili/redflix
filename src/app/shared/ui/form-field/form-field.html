<div class="form-field">
  <label class="form-field__label" [attr.for]="controlId()">
    {{ label() }}
    @if (required()) {
      <span class="form-field__required" aria-hidden="true">*</span>
    }
  </label>

  <ng-content />

  @if (error(); as text) {
    <p class="form-field__error" [id]="errorId()" role="alert">{{ text }}</p>
  } @else if (hint(); as text) {
    <p class="form-field__hint" [id]="hintId()">{{ text }}</p>
  }
</div>
